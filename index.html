<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Fábrica de las Milanesas - Local</title>
  <style>
    :root {
      --bg-dark: #141414;
      --card-bg: #222222;
      --accent: #f39c12;
      --accent-hover: #e67e22;
      --text-light: #f5f5f5;
      --text-muted: #aaaaaa;
      --whatsapp: #25d366;
      --border-subtle: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding-bottom: 100px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      background-color: #0d0d0d;
      text-align: center;
      padding: 24px 16px;
      border-bottom: 3px solid var(--accent);
    }

    .logo-container {
      width: 116px;
      height: 116px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1f1f1f;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    header h1 {
      font-size: 1.55rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .product-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      border-left: 4px solid var(--accent);
    }

    .product-info h2 {
      font-size: 1.12rem;
      margin-bottom: 4px;
    }

    .product-info .desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .product-info .price {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-dark);
      padding: 6px 8px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .btn-qty {
      background-color: var(--accent);
      color: #000000;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-qty:active {
      background-color: var(--accent-hover);
      transform: scale(0.96);
    }

    .qty-display {
      font-size: 0.98rem;
      font-weight: 700;
      min-width: 60px;
      text-align: center;
    }

    .order-details {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      margin-top: 22px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .order-details h3 {
      margin-bottom: 14px;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-size: 0.95rem;
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: var(--accent);
    }

    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0d0d0d;
      border-top: 2px solid var(--accent);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    .total-box span {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .total-box strong {
      font-size: 1.38rem;
      color: var(--accent);
    }

    .btn-whatsapp {
      background-color: var(--whatsapp);
      color: #000000;
      border: none;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-whatsapp:active:not(:disabled) {
      filter: brightness(0.92);
    }

    .btn-whatsapp:disabled {
      background-color: #3a3a3a;
      color: #888888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="retouch_2026112512531659.png" alt="Logo La Fábrica de las Milanesas" onerror="this.style.display='none'">
    </div>
    <h1>La Fábrica de las Milanesas</h1>
    <p>Local • Elaboración artesanal lista para cocinar</p>
  </header>

  <main class="container">
    <section id="productos-lista"></section>

    <section class="order-details">
      <h3>Datos para el pedido</h3>
      <div class="input-group">
        <input type="text" id="cliente-nombre" placeholder="Tu nombre" autocomplete="name">
      </div>
      <div class="input-group">
        <select id="tipo-entrega" onchange="toggleDireccion()">
          <option value="Envío a domicilio">Envío a domicilio</option>
          <option value="Retiro en el local">Retiro en el local</option>
        </select>
      </div>
      <div class="input-group" id="direccion-group">
        <input type="text" id="cliente-direccion" placeholder="Dirección de entrega (calle, número, esquina o referencias)" autocomplete="street-address">
      </div>
    </section>
  </main>

  <footer class="cart-bar">
    <div class="total-box">
      <span>Total estimado:</span>
      <strong id="total-price">$0</strong>
    </div>
    <button type="button" class="btn-whatsapp" id="btn-send" onclick="enviarPedido()" disabled>
      Pedir por WhatsApp
    </button>
  </footer>

  <script>
    const TELEFONO_WHATSAPP = "59896643887";

    const productos = {
      carne: {
        nombre: "Milanesas de Carne",
        desc: "Apanadas, sin fritar, listas para cocinar.",
        precio: 590,
        kilos: 0
      },
      pollo: {
        nombre: "Milanesas de Pollo",
        desc: "Apanadas, sin fritar, listas para cocinar.",
        precio: 390,
        kilos: 0
      },
      hamburguesa: {
        nombre: "Hamburguesas de Carne",
        desc: "100% carne vacuna, listas para cocinar.",
        precio: 390,
        kilos: 0
      }
    };

    function renderProductos() {
      const contenedor = document.getElementById("productos-lista");
      contenedor.innerHTML = Object.entries(productos).map(([id, prod]) => `
        <article class="product-card">
          <div class="product-info">
            <h2>${prod.nombre}</h2>
            <p class="desc">${prod.desc}</p>
            <div class="price">$${prod.precio} / kg</div>
          </div>
          <div class="controls">
            <button type="button" class="btn-qty" onclick="updateQty('${id}', -0.5)" aria-label="Restar 0.5 kg de ${prod.nombre}">-</button>
            <span class="qty-display" id="qty-${id}">0 kg</span>
            <button type="button" class="btn-qty" onclick="updateQty('${id}', 0.5)" aria-label="Sumar 0.5 kg de ${prod.nombre}">+</button>
          </div>
        </article>
      `).join("");
    }

    function formatKilos(kg) {
      return Number.isInteger(kg) ? `${kg} kg` : `${kg.toFixed(1).replace(".", ",")} kg`;
    }

    function updateQty(id, delta) {
      const item = productos[id];
      const nuevoValor = Math.max(0, Math.round((item.kilos + delta) * 10) / 10);
      item.kilos = nuevoValor;
      document.getElementById(`qty-${id}`).textContent = formatKilos(nuevoValor);
      calcularTotal();
    }

    function calcularTotal() {
      let total = 0;
      for (const key in productos) {
        total += productos[key].kilos * productos[key].precio;
      }
      const totalRedondeado = Math.round(total);
      document.getElementById("total-price").textContent = `$${totalRedondeado}`;
      document.getElementById("btn-send").disabled = totalRedondeado === 0;
      return totalRedondeado;
    }

    function toggleDireccion() {
      const entrega = document.getElementById("tipo-entrega").value;
      const direccionGroup = document.getElementById("direccion-group");
      direccionGroup.style.display = entrega === "Retiro en el local" ? "none" : "block";
    }

    function enviarPedido() {
      const total = calcularTotal();
      if (total === 0) return;

      const nombre = document.getElementById("cliente-nombre").value.trim() || "Cliente";
      const entrega = document.getElementById("tipo-entrega").value;
      const direccionInput = document.getElementById("cliente-direccion").value.trim();
      const direccion = entrega === "Retiro en el local"
        ? "Retira en el local"
        : (direccionInput || "No especificada");

      let mensaje = `*NUEVO PEDIDO - LA FÁBRICA DE LAS MILANESAS (Local)*\n\n`;
      mensaje += `*Cliente:* ${nombre}\n`;
      mensaje += `*Modalidad:* ${entrega}\n`;
      if (entrega === "Envío a domicilio") {
        mensaje += `*Dirección:* ${direccion}\n`;
      }
      mensaje += `\n*Detalle del pedido:*\n`;

      for (const key in productos) {
        const prod = productos[key];
        if (prod.kilos > 0) {
          const subtotal = Math.round(prod.kilos * prod.precio);
          mensaje += `• ${formatKilos(prod.kilos)} de ${prod.nombre} ($${subtotal})\n`;
        }
      }

      mensaje += `\n*TOTAL: $${total}*`;

      const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    renderProductos();
  </script>
</body>
</html>
